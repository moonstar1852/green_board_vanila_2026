<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>게시판</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="js/data.js"></script>
</head>
<body>
    <header>
        <!-- 헤더 영역 -->
        <a class="brand" href="index.html">게시판</a>
        <nav>
            <a href="index.html">게시판</a>
            <a class="write-link" href="write.html">글쓰기</a>
            <a class="login-link" href="login.html">로그인</a>
            <button class="logout-button" type="button">로그아웃</button>
        </nav>
    </header>
    <main>
        <h1>글쓰기</h1>
        <form id="post-form">
            <label>제목</label>
            <input type="text" id="title" required>
            <label>본문</label>
            <textarea id="content" required></textarea>
            <button type="submit">게시글 등록</button>
            <a href="index.html">목록으로</a>
        </form>
    </main>
    <footer>
        <!-- 하단 푸터 영역 -->
        게시판 실습
    </footer>
    <img src="leaf.svg" alt="잎사귀" width="100">
</body>
</html>
