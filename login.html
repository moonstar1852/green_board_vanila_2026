<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>로그인 | 게시판</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <!-- 헤더 영역 -->
        <a class="brand" href="index.html">게시판</a>
        <nav>
            <a href="index.html">게시판</a>
            <a class="write-link" href="write.html">글쓰기</a>
            <a class="login-link" href="login.html">로그인</a>
            <button class="logout-button" type="button">로그아웃</button>
        </nav>
    </header>
    <main>
        <h1>로그인</h1>
        <form id="login-form">
            <label>아이디 : </label>
            <input type="text" id="username" placeholder="아이디를 입력해 주세요." required autofocus>
            <label>비밀번호 : </label>
            <input type="password" id="password" required>
            <button type="submit">로그인</button>
        </form>
    </main>
    <footer>
        <!-- 하단 푸터 영역 -->
        게시판 실습
    </footer>
    
</body>
</html>
